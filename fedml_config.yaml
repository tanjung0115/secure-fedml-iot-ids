common_args:
  training_type: "cross_silo"
  scenario: "horizontal"
  using_mlops: false
  random_seed: 42

data_args:
  dataset: "ciciot2023"       # <--- Ganti nama dataset biar tidak bingung
  data_cache_dir: "./data"
  # Parameter di bawah ini sebenarnya opsional kalau kita load manual pakai pandas
  # tapi biarkan saja atau sesuaikan untuk info
  partition_method: "hetero"
  partition_alpha: 0.5
  # Tambahan Custom Arg untuk Client kita nanti:
  data_distribution: "iid"    # <--- PENTING: Ganti 'noniid' jika mau tes skenario Timpang

model_args:
  model: "ids_model"
  model_type: "dnn"           # Pilihan: "dnn" (Funnel DNN), "cnn" (1D-CNN), "mlp" (MLP)
  input_dim: 11               # 11 fitur CICIoT2023 yang dipilih
  hidden_dim: 128             # Ukuran hidden layer pertama (untuk DNN)
  output_dim: 9               # 9 kelas: Benign + 8 kategori serangan

train_args:
  federated_optimizer: "FedAvg"
  client_num_in_total: 6      # 6 node aktif (1 node excluded — hardware instability)
  client_num_per_round: 6
  comm_round: 10
  epochs: 3
  batch_size: 64
  client_optimizer: "adam"
  learning_rate: 0.001
  weight_decay: 0.001

validation_args:
  frequency_of_the_test: 1

device_args:
  using_gpu: false
  gpu_id: 0

comm_args:
  backend: "MQTT"
  mqtt_config_path: "./mqtt_config.yaml"
  is_mobile: false

tracking_args:
  log_file_dir: "./logs"
  enable_wandb: false
